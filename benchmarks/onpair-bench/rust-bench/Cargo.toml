[workspace]

[package]
name = "rust-bench"
version = "0.0.0"
edition = "2021"
publish = false

[[bin]]
name = "rust_bench"
path = "src/main.rs"

[dependencies]
# Swap to a registry version once the real crate exists.
vortex-onpair-rs = { path = "mock" }
serde_json = "1"
anyhow = "1"

[profile.release]
lto = "thin"
codegen-units = 1
debug = false

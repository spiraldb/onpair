name: "Setup Rust"
description: "Toolchain setup and cache configuration"

inputs:
  targets:
    description: "optional targets override (e.g. wasm32-unknown-unknown)"
    required: false

runs:
  using: "composite"
  steps:
    - name: Rust Version
      id: rust-version
      shell: bash
      run: echo "version=$(cat rust-toolchain.toml | grep channel | awk -F'\"' '{print $2}')" >> $GITHUB_OUTPUT

    - name: Rust Toolchain
      uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
      with:
        toolchain: "${{ steps.rust-version.outputs.version }}"
        targets: "${{inputs.targets || ''}}"
        components: rust-src, clippy, rustfmt

    - name: Rust Dependency Cache
      uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2
      with:
        save-if: ${{ github.ref_name == 'develop' }}
        shared-key: "rust-cache-${{ runner.os }}-${{ runner.environment }}" # To allow reuse across jobs

    - name: Rust Compile Cache
      uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
    - name: Rust Compile Cache Config
      shell: bash
      run: |
        echo "SCCACHE_GHA_ENABLED=true" >> $GITHUB_ENV
        echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV
        echo "CARGO_INCREMENTAL=0" >> $GITHUB_ENV
    - name: Export Path
      shell: bash
      run: echo "PATH=$PATH" >> $GITHUB_ENV

name: CI

on:
  push:
    branches: ["develop"]
  pull_request: {}
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  actions: read
  contents: read
  id-token: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-rust
      - name: Rust Build
        run: cargo build --all-features --all-targets
      - name: Rust Lint - Format
        run: cargo fmt --all --check
      - name: Rust Lint - Clippy
        run: cargo clippy --all-features --all-targets
      - name: Rust Lint - Docs
        run: cargo doc --no-deps --all-features --document-private-items
      - name: Rust Test
        run: cargo test --workspace --all-features

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Read MSRV
        id: msrv
        shell: bash
        run: echo "version=$(grep '^rust-version' Cargo.toml | awk -F'\"' '{print $2}')" >> $GITHUB_OUTPUT

      - name: Rust Toolchain
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: "${{ steps.msrv.outputs.version }}"

      - name: Rust Check
        run: cargo +${{ steps.msrv.outputs.version }} check --lib --all-features

  bench-codspeed-shard:
    name: Benchmark with Codspeed (${{ matrix.shard.name }})
    # Simulation runs single-threaded under Valgrind, so the suite is split
    # across jobs; CodSpeed merges the uploads of one workflow run.
    strategy:
      fail-fast: false
      matrix:
        shard:
          - name: train_and_compress
            filter: "tpch\\.rs::train_and_compress"
          - name: parse, decompress, clickbench
            filter: "tpch\\.rs::(parse|decompress_all)|clickbench\\.rs::"
    runs-on:
      - runs-on=${{ github.run_id }}
      - family=c7i.8xlarge
      - image=ubuntu24-full-x64
      - tag=bench-codspeed-${{ strategy.job-index }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-rust

      - name: Install Codspeed
        shell: bash
        run: cargo install --force cargo-codspeed --locked

      - name: Build benchmarks
        env:
          # Simulation runs under Valgrind, which cannot decode AVX-512.
          RUSTFLAGS: "-C target-feature=+avx2"
        run: |
          cargo codspeed build --profile bench -m simulation

      - name: Run benchmarks - Simulation
        env:
          # Run all benchmarks in one process, as before divan 6.
          CODSPEED_PROCESS_ISOLATION: "false"
        uses: CodSpeedHQ/action@af75f77f17a054769abefaa42fe8dc2975469b5f # v5.6.3
        with:
          run: cargo codspeed run '${{ matrix.shard.filter }}'
          mode: simulation

  bench-codspeed:
    name: Benchmark with Codspeed
    needs: bench-codspeed-shard
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check shards
        run: |
          [ "${{ needs.bench-codspeed-shard.result }}" = "success" ] || {
            echo "Benchmark shards result: ${{ needs.bench-codspeed-shard.result }}"
            exit 1
          }

  bench-codspeed-walltime:
    name: Benchmark with Codspeed (Walltime)
    runs-on:
      - runs-on=${{ github.run_id }}
      - family=c7i.8xlarge
      - image=ubuntu24-full-x64
      - tag=bench-codspeed-walltime
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-rust

      - name: Install Codspeed
        shell: bash
        run: cargo install --force cargo-codspeed --locked

      - name: Build benchmarks
        env:
          RUSTFLAGS: "-C target-cpu=native -C force-frame-pointers=yes"
        run: |
          cargo codspeed build --profile bench -m walltime

      - name: Run benchmarks - Walltime
        uses: CodSpeedHQ/action@af75f77f17a054769abefaa42fe8dc2975469b5f # v5.6.3
        with:
          run: cargo codspeed run
          mode: walltime
